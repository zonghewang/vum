name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    
    steps:
      - name: Random Number Generator
        id: time-stamp-generator
        run: echo "time-stamp=$(echo $(date +%s%6N))" >> $GITHUB_OUTPUT
        shell: bash
        
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Cache Primes
        id: cache-primes
        uses: actions/cache@v4
        with:
          path: |
            D:/cache
          key: ${{ runner.os }}-primes-${{ steps.time-stamp-generator.outputs.time-stamp }}
          restore-keys: |
            ${{ runner.os }}-primes-
            ${{ runner.os }}-
          
      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1

      - name: change pss securit
        shell: pwsh
        env:
          WORK_SPACE: ${{ github.workspace }}
        run: .github/workflows/scripts/win-configure-security.ps1

      - name: Create RDP User with Secure Password
        env:
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      - name: Install Tailscale
        env:
          WORK_SPACE: ${{ github.workspace }}
        shell: pwsh
        run: |
          # .github/workflows/scripts/win-install-tailscale.ps1
          # Install Tailscale MSI
          Start-Service -Name "msiserver"
          Get-Service -Name "msiserver"
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-full-1.92.3.exe"
          $installerPath = "$env:TEMP\tailscale.msi"
          $logPath = "$env:TEMP\tailscale-install.log"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart /log `"$logPath`" TARGETDIR=`"$env:WORK_SPACE\Tailscale`"" -Wait -NoNewWindow

          # 等待安装完成后检查结果
          $exitCode = $LASTEXITCODE

          # 根据退出代码判断安装是否成功
          if ($exitCode -eq 0) {
              Write-Output "安装成功"
          } else {
              Write-Output "安装失败，退出代码: $exitCode"
          }

          # 可选: 检查和显示安装日志的最后几行内容
          if (Test-Path $logPath) {
              $logContent = Get-Content $logPath -Tail 50
              Write-Output "日志内容:"
              Write-Output $logContent
          } else {
              Write-Output "日志文件不存在"
          }

          Remove-Item $installerPath -Force
          Get-ChildItem -Path "$env:WORK_SPACE\Tailscale" -File -Recurse

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          WORK_SPACE: ${{ github.workspace }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"      
          $global:file = Get-Content "${{ github.workspace }}\state.txt"
          while ($global:file -eq "true") {
            Write-Host "[$(Get-Date)] RDP Active"
            Start-Sleep -Seconds 10
            $global:file = Get-Content "${{ github.workspace }}\state.txt"
          }
