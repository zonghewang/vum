name: Windows RDP Server

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Random Number Generator
        id: time-stamp-generator
        run: echo "time-stamp=$(echo $(date +%s%6N))" >> $GITHUB_OUTPUT
        shell: bash
        
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Cache Primes
        id: cache-primes
        uses: actions/cache@v4
        with:
          path: |
            D:/cache
          key: ${{ runner.os }}-primes-${{ steps.time-stamp-generator.outputs.time-stamp }}
          restore-keys: |
            ${{ runner.os }}-primes-
            ${{ runner.os }}-
          
      - name: Configure Core RDP Settings
        shell: pwsh
        run: .github/workflows/scripts/win-configure-rdp.ps1
        
      #- uses: shaowenchen/debugger-action@v2
      #  name: debugger
      #  timeout-minutes: 300
      #  continue-on-error: true
      #  with:
      #   frp_server_addr: ${{ secrets.FRP_SERVER_ADDR }}
      #   frp_server_port: ${{ secrets.FRP_SERVER_PORT }}
      #   frp_token: ${{ secrets.FRP_TOKEN }}
      #   ssh_port: ${{ secrets.SSH_PORT }}
           
      - name: Install Tailscale
        env:
          WORK_SPACE: ${{ github.workspace }}
        shell: pwsh
        run: |
          .github/workflows/scripts/win-install-tailscale.ps1
          # # Install Tailscale MSI
          # #Remove-Item -Path "C:\ProgramData\chocolatey\logs\chocolatey.log"
          # #wmic product where "name like 'tailscale%'" call uninstall /nointeractive
          # # choco uninstall tailscale --force
          # choco install -f tailscale
          # [Environment]::SetEnvironmentVariable("Path",$Env:PATH + ";C:\Program Files\Tailscale\",[EnvironmentVariableTarget]::Machine)
          # $env:PATH -split ';' | ForEach-Object { $_ }
          # #Get-ChildItem -Path "$env:ProgramFiles" 
          # #Get-Content -Path "C:\ProgramData\chocolatey\logs\chocolatey.log"

      - name: change pss securit
       shell: pwsh
       env:
         WORK_SPACE: ${{ github.workspace }}
       run: .github/workflows/scripts/win-configure-security.ps1

      - name: Create RDP User with Secure Password
        env:
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        shell: pwsh
        run: .github/workflows/scripts/win-create-user.ps1

      # - uses: shaowenchen/debugger-action@v2
      #   name: debugger
      #   timeout-minutes: 300
      #   continue-on-error: true
      #   with:
      #    frp_server_addr: ${{ secrets.FRP_SERVER_ADDR }}
      #    frp_server_port: ${{ secrets.FRP_SERVER_PORT }}
      #    frp_token: ${{ secrets.FRP_TOKEN }}
      #    ssh_port: ${{ secrets.SSH_PORT }}

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          WORK_SPACE: ${{ github.workspace }}
        run: .github/workflows/scripts/win-establish-ts.ps1

      - name: Verify RDP Accessibility
        shell: pwsh
        run: .github/workflows/scripts/win-verify-rdp.ps1

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: vum"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"      
          $global:file = Get-Content "${{ github.workspace }}\state.txt"
          while ($global:file -eq "true") {
            Write-Host "[$(Get-Date)] RDP Active"
            Start-Sleep -Seconds 10
            $global:file = Get-Content "${{ github.workspace }}\state.txt"
          }
