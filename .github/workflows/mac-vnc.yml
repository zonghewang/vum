name: Mac VNC Server
on: 
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 3600
    
    steps:
    - uses: actions/checkout@v2
    - run: source .github/workflows/scripts/script-mac.sh

    - name: Configure VNC Server
      run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -off -restart -agent -privs -all -allowAccessFor -allUsers \
          -clientopts -setvncpw -vncpw ${{ secrets.LOGIN_PASSWORD  }}
          sudo dscl . -create /Users/vum
          sudo dscl . -create /Users/vum RealName "vum"
          sudo dscl . -create /Users/vum UniqueID 502
          sudo dscl . -create /Users/vum PrimaryGroupID 80
          sudo dscl . -create /Users/vum NFSHomeDirectory /Local/Users/vum
          sudo dscl . -create /Users/vum UserShell /bin/sh
          sudo dscl . -passwd /Users/vum /${{ secrets.LOGIN_PASSWORD  }}
          sudo dseditgroup -o edit -t group -a vum admin

    - name: install homebrew
      run: |
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

    - name: Install Tailscale
      run: brew install tailscale

    - name: Start tailscaled (manual)
      run: |
        sudo mkdir -p /var/run
        nohup sudo tailscaled >/tmp/tailscaled.log 2>&1 & disown
        sleep 3

    - name: Connect to Tailscale
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-${GITHUB_RUN_ID}
        echo "TAILSCALE_IP=$(tailscale ip -4)" >> "$GITHUB_ENV"

    - name: Keep Connection Alive
      run: |
        echo "=== VNC ACCESS INFORMATION ==="
        echo "Address: ${TAILSCALE_IP}:5900"
        echo "Password: ${VNC_PASSWORD}"
        echo "Desktop: GNOME"
        echo "=============================="
        while true; do
          echo "[$(date)] VNC Active - Cancel workflow to terminate"
          sleep 300
        done
